services:
  github-code-rag:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      REPOS_DIR: /app/repos
      CHROMA_DIR: /app/chroma_db
    volumes:
      - repos:/app/repos
      - chroma_db:/app/chroma_db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "4.0"
    mem_limit: 8g
    restart: unless-stopped

volumes:
  repos:
  chroma_db:
