<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GitHub Code RAG 在线交互演示"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235685ff'/%3E%3C/svg%3E"><title>GitHub Code RAG · Online Demo</title><style>
:root{--bg:#07090f;--panel:#111522;--line:#252c3e;--text:#f4f6fb;--muted:#9199ac;--blue:#5685ff;--violet:#8d70ff}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 75% 20%,#182448 0,transparent 32%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100vh}.shell{width:min(1120px,calc(100% - 32px));margin:auto}header{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand i{color:var(--blue);font-style:normal}header a{color:#aab6d7;text-decoration:none;font-size:13px}.hero{padding:78px 0 45px}.eyebrow{color:#829cff;font-size:12px;font-weight:750;letter-spacing:.16em}.hero h1{max-width:850px;margin:14px 0;font-size:clamp(48px,7vw,92px);line-height:.95;letter-spacing:-.06em}.hero p{max-width:680px;color:var(--muted);font-size:18px}.boundary{display:inline-flex;padding:8px 12px;border:1px solid #36425e;border-radius:99px;color:#9eabd0;font-size:11px}.workspace{display:grid;grid-template-columns:.82fr 1.18fr;gap:18px;padding-bottom:70px}.panel{padding:24px;background:rgba(17,21,34,.88);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px #0007}.panel h2{margin:0 0 22px;font-size:16px}label{display:block;margin:16px 0 7px;color:#aeb5c6;font-size:12px}input,textarea{width:100%;padding:14px;color:#eef2ff;background:#0a0d15;border:1px solid #2b3347;border-radius:12px;font:inherit;outline:none}textarea{min-height:116px;resize:vertical}input:focus,textarea:focus{border-color:var(--blue)}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;color:white;background:linear-gradient(90deg,var(--blue),var(--violet));font-weight:750;cursor:pointer}.steps{display:grid;gap:12px}.step{padding:15px 16px;display:flex;align-items:center;gap:12px;color:#747d92;background:#0b0e17;border:1px solid #23293a;border-radius:14px;transition:.35s}.step i{width:27px;height:27px;display:grid;place-items:center;border:1px solid #3a435b;border-radius:50%;font-style:normal;font-size:11px}.step.active{color:#fff;border-color:#496ec7;background:#111a31}.step.done i{color:white;background:var(--blue);border-color:var(--blue)}.answer{min-height:250px;margin-top:16px;padding:20px;color:#adb5c8;background:#090c13;border:1px solid #22293a;border-radius:16px;white-space:pre-wrap}.answer.ready{color:#e8ecf8}.sources{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.sources span{padding:6px 9px;color:#9cb4ef;background:#111a2d;border-radius:7px;font-size:10px}@media(max-width:760px){.workspace{grid-template-columns:1fr}.hero{padding-top:48px}.panel{padding:18px}}
</style></head><body><div class="shell"><header><div class="brand"><i>⌘</i> GitHub Code RAG</div><a href="https://github.com/Kankandesuyo/github-code-rag">查看源码 ↗</a></header><main><section class="hero"><div class="eyebrow">PUBLIC REPOSITORY WORKFLOW DEMO</div><h1>读懂一个仓库，<br>再回答代码问题。</h1><p>体验“仓库读取 → 相关代码检索 → 带来源回答”的核心产品流程。</p><span class="boundary">演示模式：使用内置公开样例，不上传或持久化你的源码</span></section><section class="workspace"><div class="panel"><h2>提出一个代码问题</h2><label>公开 GitHub 仓库</label><input id="repo" value="Kankandesuyo/github-code-rag" aria-label="公开 GitHub 仓库"><label>你的问题</label><textarea id="question" aria-label="你的问题">这个项目如何避免在线问答持久化源码？</textarea><button id="ask">开始分析</button></div><div class="panel"><h2>Agent 执行轨迹</h2><div class="steps"><div class="step"><i>1</i><span>读取仓库结构与安全边界</span></div><div class="step"><i>2</i><span>检索与问题最相关的代码片段</span></div><div class="step"><i>3</i><span>重排证据并生成带来源回答</span></div></div><div class="answer" id="answer">点击“开始分析”查看在线问答流程。</div><div class="sources" id="sources"></div></div></section></main></div><script>
const ask=document.querySelector('#ask'),steps=[...document.querySelectorAll('.step')],answer=document.querySelector('#answer'),sources=document.querySelector('#sources');const wait=ms=>new Promise(r=>setTimeout(r,ms));ask.onclick=async()=>{ask.disabled=true;ask.textContent='分析中…';answer.className='answer';answer.textContent='正在建立请求内临时上下文…';sources.innerHTML='';steps.forEach(s=>s.className='step');for(let i=0;i<steps.length;i++){steps[i].classList.add('active');await wait(520);steps[i].classList.remove('active');steps[i].classList.add('done')}answer.className='answer ready';answer.textContent='在线模式通过 load_repository_ephemeral() 在单次请求内读取经过过滤的公开源码，并设置 persist_manifest=False。检索和回答完成后，不写入仓库快照、manifest 或 Chroma 集合。只有用户主动切换到“深度分析”时，才会建立持久知识库。';sources.innerHTML='<span>app/services/online_search.py</span><span>app/main.py</span><span>README.md</span>';ask.disabled=false;ask.textContent='重新分析'};
</script></body></html>
